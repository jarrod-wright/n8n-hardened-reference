# =============================================================================
# docker-compose.runners.yml  -  EXTERNAL task-runners overlay (production).
#
# Layer this ON TOP of docker-compose.yml for the official checklist's
# recommended "external mode": user JS/Python Code-node execution runs in
# dedicated sidecar containers (n8nio/runners), isolated from the n8n brokers.
#
#   docker compose -f docker-compose.yml -f docker-compose.runners.yml up -d
#   # or:  make deploy-runners
#
# Grounded in the official docs:
#   https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-task-runners
#
# Requirements (per docs):
#   - n8nio/runners image version MUST match the n8nio/n8n version (2.29.10).
#   - In queue mode, each broker (main + each worker) needs its OWN runner sidecar.
#   - The broker listens on port 5679; runners connect via N8N_RUNNERS_TASK_BROKER_URI.
#   - N8N_RUNNERS_AUTH_TOKEN is required (fail-closed) - shared secret.
#   - Confirm an arm64 manifest for n8nio/runners:2.29.10 if deploying on Arm.
#
# Image pinning: n8nio/runners is pinned to the sha256 digest validated by a
# clean-room `make deploy-runners` run (see `make pin-digests`); must be bumped
# in lockstep with the n8n image pin above.
#
# NOTE: N8N_RUNNERS_ENABLED is intentionally NOT set below. It is deprecated
# upstream (n8n-io/n8n packages/cli/src/deprecation/deprecation.service.ts:
# `{ envVar: 'N8N_RUNNERS_ENABLED', message: SAFE_TO_REMOVE }` - "Remove this
# environment variable; it is no longer needed."), confirmed by live source
# probe 2026-07-26 (VPSHR ADR-004). N8N_RUNNERS_MODE=external is sufficient to
# enable the external-mode runners this overlay configures.
# =============================================================================

services:
  n8n:
    environment:
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}"

  n8n-worker:
    environment:
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}"

  n8n-runner:
    image: n8nio/runners:2.29.10@sha256:d519d92fc90116897671a7d84aae87b160b92fce0b4b02fc65f2221bbd827ef6
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}"
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - backend

  n8n-worker-runner:
    image: n8nio/runners:2.29.10@sha256:d519d92fc90116897671a7d84aae87b160b92fce0b4b02fc65f2221bbd827ef6
    restart: unless-stopped
    depends_on:
      n8n-worker:
        condition: service_started
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN:?N8N_RUNNERS_AUTH_TOKEN must be set in .env}"
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - backend
