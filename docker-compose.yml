# =============================================================================
# n8n-hardened-reference - docker-compose.yml
#
# Production self-host of n8n in QUEUE MODE (main + worker) behind Caddy with
# automatic TLS, backed by PostgreSQL + Redis. Only Caddy is published to the
# host; n8n / Postgres / Redis are reachable only on internal Docker networks.
#
# Hardening layered in this file:
#   - Least-privilege containers: cap_drop ALL + minimal cap_add per image.
#   - no-new-privileges on every service; read-only rootfs where safe (caddy).
#   - Non-root PostgreSQL app user (see postgres/init-data.sh); n8n never
#     connects as the DB superuser.
#   - Per-service memory limits + bounded json-file logging (no disk fill).
#   - Secrets via Docker file-secrets (encryption key + both DB passwords).
#
# Task runners: on n8n 2.x these are ENABLED BY DEFAULT (internal mode). For the
# official checklist's "external mode in prod", layer docker-compose.runners.yml
# (added next increment) - see SECURITY.md.
#
# Threat model & rationale: README.md + SECURITY.md.
#
# Image pinning: tags are for READABILITY and are MUTABLE. The real immutability
# control is the sha256 digest - resolve + pin before prod (`make pin-digests`).
# n8n is pinned to a specific stable release; bump deliberately after reading the
# release notes, never to a floating :latest / :stable.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-n8n-env: &n8n-env
  # --- Database (PostgreSQL) - n8n connects as the NON-ROOT app user ---
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
  DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER:-n8n}
  DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_non_root_password
  # --- Queue mode (Redis / Bull) ---
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  # --- Encryption key (persisted secret; NO recovery if lost - back it up) ---
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  # --- Public URL / proxy awareness (behind Caddy) ---
  N8N_HOST: ${N8N_HOST}
  N8N_PORT: "5678"
  N8N_PROTOCOL: https
  N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
  WEBHOOK_URL: https://${N8N_HOST}/
  N8N_PROXY_HOPS: "1"
  # --- Timezone ---
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Etc/UTC}
  TZ: ${GENERIC_TIMEZONE:-Etc/UTC}
  # --- Security hardening (official n8n production checklist) ---
  N8N_SECURE_COOKIE: "true"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n
  N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"            # hours (14 days)
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PUBLIC_API_DISABLED: "true"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_HIRING_BANNER_ENABLED: "false"
  # Disable high-risk built-in nodes (arbitrary command / SSH execution).
  NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh"]'
  # NOTE: N8N_BASIC_AUTH_* is intentionally ABSENT - removed in n8n v1.0
  # (replaced by user management + RBAC). Do not reintroduce it.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      N8N_HOST: ${N8N_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE      # bind privileged ports 80/443
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - proxy

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *n8n-env
    secrets:
      - postgres_non_root_password
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - proxy
      - backend

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    restart: unless-stopped
    command: worker
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      <<: *n8n-env
    secrets:
      - postgres_non_root_password
      - n8n_encryption_key
    volumes:
      - n8n_data:/home/node/.n8n
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 640M
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}          # superuser (init + healthcheck only)
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:-n8n}
      POSTGRES_NON_ROOT_PASSWORD_FILE: /run/secrets/postgres_non_root_password
    secrets:
      - postgres_password
      - postgres_non_root_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  proxy:
  backend:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_non_root_password:
    file: ./secrets/postgres_non_root_password.txt
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key.txt
